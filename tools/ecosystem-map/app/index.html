<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge614 · Mapa del ecosistema</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 10.5v11L16 29 3 21.5v-11z' fill='%2338d6f5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="office" aria-label="Oficina 3D del ecosistema Forge614"></main>

    <div class="hud" aria-hidden="true">
      <span class="hud__corner hud__corner--tl"></span>
      <span class="hud__corner hud__corner--tr"></span>
      <span class="hud__corner hud__corner--bl"></span>
      <span class="hud__corner hud__corner--br"></span>
      <div class="hud__readout">
        <span class="hud__label">CÁMARA</span>
        <span id="telemetry" class="hud__value"></span>
      </div>
      <div class="hud__hint">ARRASTRA PARA MOVERTE · RUEDA PARA ACERCAR</div>
    </div>

    <header class="topbar">
      <span class="topbar__mark"></span>
      <span class="topbar__brand">FORGE614</span>
      <span class="topbar__divider">//</span>
      <span class="topbar__title">Mapa del ecosistema</span>
      <span class="topbar__status"><span class="topbar__dot"></span>VISTA GENERAL</span>
    </header>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
